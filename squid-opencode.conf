# squid.conf
http_port 3128
acl allowed_domains dstdomain .openrouter.ai .models.dev .opencode.ai
# add your provider, e.g. .openai.com .openrouter.ai
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT SSL_ports allowed_domains
http_access deny all
access_log stdio:/dev/stdout
cache deny all
