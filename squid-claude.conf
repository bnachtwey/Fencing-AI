# Squid config template. @SQUIDLOG@ is substituted by entrypoint-proxy.sh.
http_port 3128
acl allowed_domains dstdomain .claude.ai .claude.com .anthropic.com
pid_filename none
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT SSL_ports allowed_domains
http_access deny all
access_log @SQUIDLOG@/access.log
cache_log @SQUIDLOG@/cache.log
cache deny all
