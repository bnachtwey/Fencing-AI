# Mammouth Code egress policy. Start with the documented API host; inspect
# denied requests in the access log and add only hosts the client requires.
http_port 3128
acl allowed_domains dstdomain api.mammouth.ai
pid_filename none
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT SSL_ports allowed_domains
http_access deny all
access_log @SQUIDLOG@/access.log
cache_log @SQUIDLOG@/cache.log
cache deny all
